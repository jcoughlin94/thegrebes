<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Grebes – Videos</title>
  <style>
    @font-face {
      font-family: 'Cochin';
      src: local('Cochin');
    }
    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Arial', sans-serif;
      height: 100%;
      width: 100%;
      background: url('alpacas.jpeg') no-repeat center bottom fixed;
      background-size: cover;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .banner {
      background-color: #ffffff;
      padding: 1.5rem 2rem;
      text-align: center;
      border: 2px solid black;
      margin-top: 2rem;
      max-width: 700px;
      width: 90%;
      line-height: 1.5;
    }
    .banner h1 {
      font-size: 2.5rem;
      margin: 0 0 1rem 0;
      font-family: 'Cochin', serif;
      font-style: italic;
      font-weight: bold;
      text-transform: uppercase;
    }
    .banner a {
      text-decoration: none;
      color: black;
      font-style: italic;
      font-family: 'Cochin', serif;
      font-weight: normal;
      font-size: 1.25rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      display: inline-block;
      margin: 0.25rem 0.5rem;
    }
    .banner a:hover {
      text-decoration: underline;
    }
    .video-container {
      background-color: #ffffff;
      width: 90%;
      max-width: 700px;
      margin: 2rem auto;
      padding: 2rem;
      border: 1px solid #333;
    }
    .video-container:last-of-type {
      margin-bottom: 5rem; 
    }
    .responsive-video {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
    }
    .responsive-video iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .responsive-video:not(:last-child) {
      margin-bottom: 2rem;
  }
    @media (max-width: 600px) {
      .banner {
        padding: 1rem;
        max-width: 95%;
      }
      .banner h1 {
        font-size: 2rem;
      }
      .banner a {
        font-size: 1.1rem;
      }
      .video-container {
        padding: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="banner">
    <h1>The Grebes</h1>
    <a href="index.html">Home</a> /
    <a href="videos.html">Videos</a> /
    <a href="https://the-grebes.bandcamp.com/" target="_blank">Listen on Bandcamp</a>
  </div>
  <div class="video-container">
    <div class="responsive-video">
      <iframe width="560" height="315" src="https://www.youtube.com/embed/AF7GUMo9rOQ?si=dVHNso5o5Z1RLE5x" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </div>
    <div class="responsive-video">
      <iframe width="560" height="315" src="https://www.youtube.com/embed/7vyaRn9c_2M" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </div>
    <div class="responsive-video">
      <iframe width="560" height="315" src="https://www.youtube.com/embed/c0eDJcqTlzI" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </div>
  </div>
</body>
</html>
